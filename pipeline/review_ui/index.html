<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NC//LOC-RO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07070b; --panel:#0e0e15; --panel2:#14141e; --line:#2a2a3a;
  --yellow:#fcee0a; --cyan:#02d7f2; --red:#ff003c; --green:#00ff9f; --dim:#8a8aa3; --text:#e8e8f0;
  --font:"Rajdhani","Segoe UI",sans-serif; --mono:"Share Tech Mono",Consolas,monospace;
  --cut:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.35 var(--font)}
body{background-image:linear-gradient(rgba(2,215,242,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(2,215,242,.04) 1px,transparent 1px);background-size:40px 40px;min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:50}
a{color:var(--cyan)}
header{position:sticky;top:0;z-index:20;background:rgba(7,7,11,.94);border-bottom:2px solid var(--yellow);backdrop-filter:blur(4px)}
.bar{display:flex;align-items:center;gap:18px;padding:10px 20px;flex-wrap:wrap}
.logo{font:700 26px/1 var(--font);letter-spacing:2px;color:var(--yellow);text-shadow:2px 0 var(--red),-2px 0 var(--cyan);white-space:nowrap}
.logo small{display:block;font:12px var(--mono);letter-spacing:1px;color:var(--dim);text-shadow:none;margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.stat{font:13px var(--mono);padding:5px 10px;border:1px solid var(--line);background:var(--panel);clip-path:var(--cut)}
.stat b{color:var(--yellow);font-weight:400}
.led{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--red);box-shadow:0 0 8px var(--red)}
.led.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.led.busy{background:var(--yellow);box-shadow:0 0 8px var(--yellow);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.progress{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;padding:0 20px 12px}
.prog{font:13px var(--mono);color:var(--dim)}
.prog .track{height:8px;background:var(--panel2);border:1px solid var(--line);margin-top:4px;position:relative;overflow:hidden}
.prog .fill{height:100%;background:linear-gradient(90deg,var(--yellow),var(--cyan));width:0;transition:width .6s}
nav{display:flex;gap:4px;padding:0 20px}
nav button{font:700 15px var(--font);letter-spacing:2px;color:var(--dim);background:none;border:none;border-bottom:3px solid transparent;padding:8px 16px;cursor:pointer}
nav button.active{color:var(--yellow);border-color:var(--yellow)}
nav button .n{font:12px var(--mono);color:var(--cyan);margin-left:6px}
main{padding:18px 20px 60px;max-width:1300px;margin:0 auto}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
input,select,textarea{font:15px var(--font);color:var(--text);background:var(--panel);border:1px solid var(--line);padding:7px 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cyan)}
.btn{font:700 13px var(--font);letter-spacing:1.5px;padding:7px 14px;border:1px solid currentColor;background:transparent;cursor:pointer;clip-path:var(--cut);color:var(--cyan)}
.btn:hover{background:rgba(2,215,242,.12)}
.btn.y{color:var(--yellow)}.btn.y:hover{background:rgba(252,238,10,.12)}
.btn.r{color:var(--red)}.btn.r:hover{background:rgba(255,0,60,.12)}
.btn.g{color:var(--green)}.btn.g:hover{background:rgba(0,255,159,.12)}
.btn.on{background:currentColor}.btn.on span{color:#000}
.hint{font:13px var(--mono);color:var(--dim)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border-left:3px solid var(--cyan);clip-path:var(--cut);padding:14px 18px;position:relative}
.card.flagged{border-left-color:var(--red);background:linear-gradient(90deg,rgba(255,0,60,.08),var(--panel) 40%)}
.card.ok{border-left-color:var(--green)}
.card.new{animation:glitchIn .5s}
@keyframes glitchIn{0%{opacity:0;transform:translateX(-8px);filter:hue-rotate(90deg)}30%{opacity:1;transform:translateX(4px)}60%{transform:translateX(-2px)}100%{transform:none;filter:none}}
.row{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.en{font:600 20px var(--font);color:var(--text)}
.arrow{color:var(--dim);font-family:var(--mono)}
.ro{font:700 22px var(--font);color:var(--yellow)}
.tag{font:12px var(--mono);padding:2px 8px;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;letter-spacing:1px}
.tag.keep{color:var(--cyan);border-color:var(--cyan)}
.tag.translate{color:var(--yellow);border-color:var(--yellow)}
.tag.adapt{color:var(--green);border-color:var(--green)}
.tag.high{color:var(--green)}.tag.medium{color:var(--yellow)}.tag.low{color:var(--red);border-color:var(--red)}
.meta{font:13px var(--mono);color:var(--dim);margin-top:6px}
.note{margin-top:6px;color:#c8c8d8}
.note b{color:var(--cyan);font-weight:600}
details{margin-top:10px}
summary{cursor:pointer;font:700 13px var(--font);letter-spacing:2px;color:var(--cyan);list-style:none}
summary::before{content:"▸ "}details[open] summary::before{content:"▾ "}
.src{margin-top:8px;border:1px solid var(--line);background:var(--panel2);padding:10px 12px}
.src+.src{margin-top:6px}
.src .l{display:grid;grid-template-columns:34px 1fr;gap:8px;margin:3px 0}
.src .k{font:12px var(--mono);color:var(--dim);padding-top:3px}
.src .path{font:12px var(--mono);color:var(--cyan);word-break:break-all;margin-top:6px}
mark{background:rgba(252,238,10,.22);color:var(--yellow);padding:0 2px}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
.flagform{margin-top:10px;display:grid;gap:8px;grid-template-columns:1fr 1fr;padding:12px;border:1px solid var(--red);background:rgba(255,0,60,.05)}
.flagform textarea{grid-column:1/-1;min-height:56px;resize:vertical}
.flagform .actions{grid-column:1/-1;margin:0}
.flaginfo{margin-top:8px;font-size:15px;color:#ffb3c4}
.flaginfo b{color:var(--red)}
.claude{margin-top:10px;padding:8px 12px;font-size:15px;border-left:3px solid var(--cyan);background:rgba(2,215,242,.07)}
.claude b.h{font:700 12px var(--font);letter-spacing:2px;margin-right:6px}
.claude.ok b.h{color:var(--green)}.claude.fixed{border-color:var(--yellow);background:rgba(252,238,10,.06)}
.claude.fixed b.h{color:var(--yellow)}.claude.flagged{border-color:var(--red);background:rgba(255,0,60,.07)}
.claude.flagged b.h{color:var(--red)}.claude .fix{color:var(--yellow);font-weight:700}
.empty{padding:40px;text-align:center;color:var(--dim);font:15px var(--mono);border:1px dashed var(--line)}
.empty b{color:var(--yellow);font-family:var(--font);font-size:20px;display:block;margin-bottom:6px}
.variants{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin-top:6px}
.variants .k{font:12px var(--mono);color:var(--dim);padding-top:4px}
.variants .ro{font-size:18px}
.ctx{margin-top:8px;font-size:14px}
.ctx div{padding:4px 8px;border-left:2px solid var(--line)}
.ctx div.me{border-color:var(--yellow);background:rgba(252,238,10,.06)}
.ctx .ro{font-size:14px;font-weight:600}
.more{margin:16px auto;display:block}
.newbar{position:sticky;top:var(--hdr,200px);z-index:10;display:block;width:100%;margin-bottom:12px;padding:9px;cursor:pointer;
  font:700 14px var(--font);letter-spacing:2px;color:#000;background:var(--yellow);border:none;clip-path:var(--cut);animation:pulse 1.6s infinite}
.errors{font:13px var(--mono);color:var(--red);padding:0 20px 8px}
.runs{font:13px var(--mono);color:var(--text);padding:0 20px 8px}
.runs div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.runs b{color:var(--yellow);font-weight:400}
.spin{display:inline-block;width:10px;height:10px;border:2px solid var(--yellow);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.slot{display:inline-block;width:18px;height:6px;background:var(--panel2);border:1px solid var(--line);margin-right:3px}
.slot.on{background:var(--yellow);animation:pulse 1s infinite}
/* swipe mode */
.swipe{position:relative;max-width:760px;margin:0 auto;padding-top:6px}
.deck{position:relative;min-height:360px}
.deck .card{transition:transform .25s ease,opacity .25s ease;touch-action:pan-y;user-select:none;cursor:grab;padding:22px 26px}
.deck .card.dragging{transition:none;cursor:grabbing}
.deck .card.next{position:absolute;inset:0 0 auto 0;transform:scale(.96) translateY(14px);opacity:.35;pointer-events:none;z-index:-1;max-height:200px;overflow:hidden}
.deck .card .en{font-size:28px}.deck .card .ro{font-size:32px}
.stamp{position:absolute;top:18px;font:700 26px var(--font);letter-spacing:3px;padding:4px 14px;border:3px solid;opacity:0;pointer-events:none}
.stamp.okst{right:22px;color:var(--green);transform:rotate(8deg)}
.stamp.flagst{left:22px;color:var(--red);transform:rotate(-8deg)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:18px}
.key{background:var(--panel);border:1px solid var(--line);padding:10px;text-align:center;cursor:pointer;clip-path:var(--cut);font:700 13px var(--font);letter-spacing:1.5px}
.key kbd{display:block;font:20px var(--mono);margin-bottom:2px}
.key.l{color:var(--red)}.key.r{color:var(--green)}.key.u{color:var(--cyan)}.key.d{color:var(--dim)}
.key:hover{background:var(--panel2)}
.reasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px;margin-top:12px}
.reasons button{text-align:left;font:600 14px var(--font);color:var(--text);background:var(--panel2);border:1px solid var(--line);padding:7px 10px;cursor:pointer}
.reasons button kbd{color:var(--red);font-family:var(--mono);margin-right:6px}
.reasons button.sel{border-color:var(--red);background:rgba(255,0,60,.15)}
.swipe .flagpanel{margin-top:14px;padding:14px;border:1px solid var(--red);background:rgba(255,0,60,.05)}
.swipe .flagpanel input,.swipe .flagpanel textarea{width:100%;margin-top:8px}
.counter{font:13px var(--mono);color:var(--dim);text-align:center;margin-top:12px}
.counter b{color:var(--yellow);font-weight:400}
@media (max-width:640px){.keys{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.bar{padding:10px 16px}.progress,nav,main{padding-left:16px;padding-right:16px}.flagform{grid-template-columns:1fr}.chips{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">NC//LOC-RO<small>CYBERPUNK 2077 · LOCALIZARE ROMÂNĂ · MINIMAX + BEAM</small></div>
    <div class="chips">
      <div class="stat" id="s-llm"><span class="led"></span>MINIMAX ...</div>
      <div class="stat" id="s-rate">RITM <b>–</b></div>
      <div class="stat" id="s-avg">LOT <b>–</b></div>
      <div class="stat" id="s-fail">ERORI <b>0</b></div>
      <div class="stat" id="s-rev">REVIZUIT <b>0</b> · SEMNALAT <b>0</b></div>
    </div>
  </div>
  <div class="progress">
    <div class="prog" id="p-gloss">GLOSAR<div class="track"><div class="fill"></div></div></div>
    <div class="prog" id="p-str">TRADUCERI<div class="track"><div class="fill"></div></div></div>
  </div>
  <div class="runs" id="runs"></div>
  <div class="errors" id="errors"></div>
  <nav>
    <button data-tab="swipe" class="active">SWIPE<span class="n" id="n-todo"></span></button>
    <button data-tab="live">LIVE</button>
    <button data-tab="glossary">GLOSAR<span class="n" id="n-gloss"></span></button>
    <button data-tab="strings">TRADUCERI<span class="n" id="n-str"></span></button>
    <button data-tab="terms">TERMENI<span class="n" id="n-terms"></span></button>
    <button data-tab="flagged">SEMNALATE<span class="n" id="n-flag"></span></button>
  </nav>
</header>
<main>
  <div class="filters" id="filters"></div>
  <button class="newbar" id="newbar" hidden></button>
  <div class="list" id="list"></div>
  <button class="btn more" id="more" hidden>ÎNCARCĂ MAI MULT</button>
</main>
<script>
const REASONS = ["Traducere greșită","Arhaism / sună învechit","Sună nenatural / calc","Trebuia lăsat în engleză",
  "Trebuia tradus","Gen / acord greșit","Ortografie / diacritice","Prea lung pentru UI","Ton / registru greșit","Altceva"];
const SOURCE = {proper:"nume propriu găsit în text", ui:"etichetă de interfață", slang:"argou (listă inițială)",
  "slang-llm":"argou găsit de MiniMax"};
const DECISION = {keep:"PĂSTRAT EN", translate:"TRADUS", adapt:"ADAPTAT"};
const state = {tab:"swipe", items:[], offset:0, total:0, since:0, paused:false, filters:{}, open:new Set(), forms:new Set()};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = t => { if(!t) return "–"; const s = Date.now()/1000 - t; return s<60 ? `${s|0}s` : s<3600 ? `${s/60|0}m` : `${s/3600|0}h`; };
// A failed request yields an empty list instead of breaking the page (the next poll retries).
const api = (p, q={}) => fetch(p + "?" + new URLSearchParams(Object.entries(q).filter(([,v]) => v !== "" && v != null)))
  .then(r => r.json()).then(d => d.error ? {items: [], total: 0, error: d.error} : d).catch(() => ({items: [], total: 0}));
const hl = (text, term) => { const t = esc(text); if(!term) return t; const e = esc(term).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return t.replace(new RegExp(`(?<![\\w])${e}(?![\\w])`, "gi"), m => `<mark>${m}</mark>`); };

// ---------- header stats ----------
async function stats(){
  let s; try { s = await api("/api/stats"); } catch { $("#s-llm").innerHTML = `<span class="led"></span>SERVER OFFLINE`; return; }
  if (!s || !s.llm) return;  // transient server error: keep the last numbers
  const busy = s.llm.last_at && s.now - s.llm.last_at < 180;
  $("#s-llm").innerHTML = `<span class="led ${s.ollama ? (busy ? "busy" : "on") : ""}"></span>OLLAMA ${!s.ollama ? "OFFLINE" : busy ? "LUCREAZĂ" : "ONLINE · INACTIV"}`;
  $("#s-rate").innerHTML = `RITM <b>${s.llm.items_10m ? (s.llm.items_10m/10).toFixed(1) : "–"}</b>/min`;
  $("#s-avg").innerHTML = `LOT <b>${s.llm.avg_secs ? s.llm.avg_secs.toFixed(0)+"s" : "–"}</b> · ULTIMUL ${ago(s.llm.last_at)}`;
  $("#s-fail").innerHTML = `ERORI <b style="color:${s.llm.failed ? "var(--red)" : ""}">${s.llm.failed}</b>${s.llm.missing_10m ? ` · LIPSĂ ${s.llm.missing_10m}` : ""}`;
  const rv = (k, who) => s.reviews.filter(r => r.status === k && (!who || r.reviewer === who)).reduce((a, r) => a + r.n, 0);
  const cl = rv("ok", "claude") + rv("fixed", "claude") + rv("flagged", "claude");
  $("#s-rev").innerHTML = `TU <b>${rv("ok", "user")}</b>✓ <b style="color:var(--red)">${rv("flagged", "user")}</b>⚑`
    + (cl ? ` · CLAUDE <b>${rv("ok", "claude")}</b>✓ <b>${rv("fixed", "claude")}</b>✎ <b style="color:var(--red)">${rv("flagged", "claude")}</b>?` : "");
  const g = s.glossary, pct = (a, b) => b ? Math.min(100, 100*a/b) : 0;
  $("#p-gloss").firstChild.textContent = `GLOSAR · ${g.drafted}/${g.candidates} candidați procesați · ${g.terms} termeni unici (+${g.variants || 0} variante comasate) · ${g.noise} respinși ca zgomot`;
  $("#p-gloss .fill").style.width = pct(g.drafted, g.candidates) + "%";
  $("#p-str").firstChild.textContent = `TRADUCERI · ${s.strings.translated}/${s.strings.total} replici & texte`;
  $("#p-str .fill").style.width = pct(s.strings.translated, s.strings.total) + "%";
  $("#n-gloss").textContent = g.terms || ""; $("#n-str").textContent = s.strings.translated || "";
  $("#n-flag").textContent = rv("flagged") || "";
  $("#n-todo").textContent = Math.max(0, g.terms + s.strings.translated - rv("ok") - rv("flagged") - rv("fixed") + rv("flagged", "claude")) || "";
  $("#errors").textContent = s.llm.errors.length ? "ULTIMA EROARE: " + s.llm.errors[0].error : "";
  const STAGE = {glossary: "GLOSAR", translate: "TRADUCERE · DEEPSEEK", redo: "REFACERE v1 · BEAM", jargon: "ARGOU"};
  $("#runs").innerHTML = s.runs.filter(r => r.inflight > 0 || s.now - r.updated_at < 60).map(r => {
    const live = r.inflight > 0, eta = r.done && live ? (s.now - r.started_at) / r.done * (r.total - r.done) : null;
    return `<div>${live ? `<span class="spin"></span>` : "✓"} <b>${STAGE[r.stage] || esc(r.stage)}</b>
      ${live ? `AI lucrează · ${"<span class='slot on'></span>".repeat(r.inflight)} ${r.inflight} loturi în curs` : "gata"}
      · ${r.done}/${r.total} · pornit acum ${ago(r.started_at)}${eta ? ` · mai durează ~${eta < 3600 ? (eta/60|0) + " min" : (eta/3600).toFixed(1) + " h"}` : live && !r.done ? " · primul rezultat în 1-3 min" : ""}
      ${r.note ? `<span class="hint">· ${esc(r.note)}</span>` : ""}</div>`; }).join("");
  if (s.runs.some(r => r.inflight > 0)) $("#s-llm").innerHTML = `<span class="led busy"></span>AI LUCREAZĂ`;
  state.stats = s;
  if (state.tab === "glossary" && !$("#f-type").dataset.filled) fillTypes();
}

// ---------- cards ----------
function claudeBlock(it){
  if (it.reviewer !== "claude" || !it.review) return "";
  const head = {ok: "✓ VERIFICAT DE CLAUDE", fixed: "✎ CLAUDE A CORECTAT", flagged: "? CLAUDE TE ÎNTREABĂ"}[it.review] || it.review;
  return `<div class="claude ${esc(it.review)}"><b class="h">${head}</b>${it.review === "fixed" ? `<span class="fix">${esc(it.correction)}</span> ` : ""}${esc(it.comment).replace(/\n\{.*$/s, "")}</div>`;
}
function reviewBlock(kind, ref, it){
  const id = kind + ":" + ref, mine = (it.reviewer || "user") === "user";
  let h = claudeBlock(it);
  if (mine && it.review === "flagged") h += `<div class="flaginfo"><b>⚑ ${esc(it.reason)}</b>${it.correction ? ` — corectură: <b style="color:var(--yellow)">${esc(it.correction)}</b>` : ""}${it.comment ? `<br>${esc(it.comment)}` : ""}</div>`;
  h += `<div class="actions">
    <button class="btn g ${mine && it.review === "ok" ? "on" : ""}" data-act="ok" data-id="${esc(id)}"><span>✓ E OK</span></button>
    <button class="btn r ${mine && it.review === "flagged" ? "on" : ""}" data-act="flag" data-id="${esc(id)}"><span>⚑ SEMNALEAZĂ</span></button>
    ${it.review && mine ? `<button class="btn" data-act="clear" data-id="${esc(id)}">ANULEAZĂ</button>` : ""}</div>`;
  if (state.forms.has(id)) h += `<div class="flagform" data-form="${esc(id)}">
    <select name="reason">${REASONS.map(r => `<option ${r === it.reason ? "selected" : ""}>${r}</option>`).join("")}</select>
    <input name="correction" placeholder="Cum ar trebui să fie (opțional)" value="${esc(it.correction)}">
    <textarea name="comment" placeholder="Ce nu e în regulă? (opțional)">${esc(it.comment)}</textarea>
    <div class="actions"><button class="btn r" data-act="save" data-id="${esc(id)}">SALVEAZĂ SEMNALAREA</button>
    <button class="btn" data-act="cancel" data-id="${esc(id)}">RENUNȚĂ</button></div></div>`;
  return h;
}

function glossaryCard(g, fresh){
  const id = "glossary:" + g.term, cls = g.review === "flagged" ? "flagged" : g.review === "ok" ? "ok" : "";
  const gram = [g.gender && g.gender !== "-" ? `gen ${g.gender}` : "", g.plural ? `pl. ${g.plural}` : ""].filter(Boolean).join(" · ");
  const ex = (g.examples || []).map(e => `<div class="src">
      <div class="l"><span class="k">EN</span><span>${hl(e.en, g.term)}</span></div>
      <div class="l"><span class="k">RO</span><span class="ro" style="font-size:16px">${hl(e.ro, g.ro) || "<i class=hint>—</i>"}</span></div>
      <div class="path">${esc(e.file || "")}${e.category ? " · " + esc(e.category) : ""}${e.key ? " · " + esc(e.key) : ""}</div></div>`).join("");
  return `<div class="card ${cls} ${fresh ? "new" : ""}" data-key="${esc(id)}">
    <div class="row"><span class="en">${esc(g.term)}</span><span class="arrow">──▶</span><span class="ro">${esc(g.ro)}</span>

async function decide(status, extra = {}){

  if (b.dataset.act === "cancel") { state.forms.delete(id); return render(); }
  if (b.dataset.act === "save") { const f = document.querySelector(`[data-form="${CSS.escape(id)}"]`);
    const v = n => f.querySelector(`[name=${n}]`).value.trim();
    return send({status: "flagged", reason: v("reason"), correction: v("correction"), comment: v("comment")}); }
};

filtersFor(state.tab); stats(); load();
setInterval(stats, 5000); setInterval(poll, 3000);
setInterval(() => { if (state.tab === "swipe" && !SW.queue.length) loadSwipe(false); }, 10000);
</script>
</body>
</html>
